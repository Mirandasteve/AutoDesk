[tool:pytest]
pythonpath = .
testpaths = ../tests
addopts = -q
markers =
    api: API integration tests
    ml: machine learning tests
    slow: slow-running tests
[coverage:run]
branch = True
source = app
omit =
    app/seed.py
    app/__init__.py
[coverage:report]
show_missing = True
skip_covered = True
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.: