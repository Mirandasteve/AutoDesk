<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AutoDesk - ML based IT ticket classification and routing system"
    />

    <!-- Match the app shell background so the browser chrome blends into the
         canvas on mobile and prevents a white flash before React mounts. -->
    <meta name="theme-color" content="#f6f7fb" />

    <!-- Inter is declared first in the Tailwind sans stack; these preconnects
         let the browser fetch it in parallel with the bundle. The stylesheet
         falls back to system-ui if the CDN is unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234a68f5'/%3E%3Cpath d='M16 7l8 18h-4.6L16 17.6 12.6 25H8L16 7z' fill='white'/%3E%3C/svg%3E"
    />

    <title>AutoDesk - IT Support Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
